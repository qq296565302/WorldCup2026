# WorldCup2026 Nginx 完整配置
# 适用于独立部署（非共享 nginx 的场景）
# 使用方式：将此文件内容放入 nginx.conf 的 http { } 块中

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 64;

    # =============== HTTP → HTTPS 重定向 ===============
    server {
        listen 80;
        server_name your-domain.com;  # 改成你的域名

        # 强制跳转 HTTPS
        return 301 https://$host$request_uri;
    }

    # =============== HTTPS 服务 ===============
    server {
        listen 443 ssl;
        server_name your-domain.com;  # 改成你的域名

        ssl_certificate      ssl/your-domain.com.pem;   # 改成证书路径
        ssl_certificate_key  ssl/your-domain.com.key;    # 改成私钥路径

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        root /path/to/dist;           # 改成 dist 目录的实际路径
        index index.html;

        # 前端路由 — SPA 所有路径都返回 index.html
        # 必须配置此项，否则二级页面刷新会404
        # 注意：末尾不要加 =404，否则 SPA 路由会返回404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 反向代理：wheniskickoff.com
        location /api/wheniskickoff/ {
            proxy_pass https://wheniskickoff.com/data/v1/;
            proxy_ssl_server_name on;
            proxy_set_header Host wheniskickoff.com;
            proxy_set_header Accept application/json;
        }

        # 反向代理：TheSportsDB
        location /api/thesportsdb/ {
            proxy_pass https://www.thesportsdb.com/api/v1/json/3/;
            proxy_ssl_server_name on;
            proxy_set_header Host www.thesportsdb.com;
            proxy_set_header Accept application/json;
        }

        # 反向代理：懂球帝
        # 固定桌面 User-Agent，防止手机端被重定向到 m.dongqiudi.com 触发 CORS
        location /api/dongqiudi/ {
            proxy_pass https://www.dongqiudi.com/;
            proxy_ssl_server_name on;
            proxy_set_header Host www.dongqiudi.com;
            proxy_set_header Referer https://www.dongqiudi.com/;
            proxy_set_header Accept application/json;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36";
            proxy_redirect ~*m\.dongqiudi\.com https://$host/api/dongqiudi;
        }

        # 反向代理：咪咕视频
        location /api/migu/ {
            proxy_pass https://app-sc.miguvideo.com/;
            proxy_ssl_server_name on;
            proxy_set_header Host app-sc.miguvideo.com;
            proxy_set_header Referer https://www.miguvideo.com/;
            proxy_set_header Origin https://www.miguvideo.com;
            proxy_set_header Accept application/json;
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36";
        }

        # 静态资源缓存（带 hash 的文件长期缓存）
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # JSON 数据文件缓存（球员数据按需加载）
        location /data/ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # index.html 不缓存，确保每次都获取最新版本
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
